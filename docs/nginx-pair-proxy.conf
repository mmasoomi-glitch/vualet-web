# ─────────────────────────────────────────────────────────────────────────────
# WHATSAPP PAIRING PAGE — PUBLIC PROXY
#
# THIS FILE IS NOT APPLIED. It is the tracked source of truth for a snippet that
# lives on the web host at /etc/nginx/snippets/wa-locations.conf, included from
# the mira.vualet.com vhost. Nothing in this repo installs it; an operator does,
# deliberately, with the steps at the foot of this file.
#
# WHAT IT IS FOR
# The QR pairing page is served by the WhatsApp gateway, which binds
# 127.0.0.1:8790 on the ENGINE host (23.88.59.31) and nothing else — jury C4.
# From this host that address is reachable only through wa-tunnel.service, an
# SSH forward restricted to permitopen 127.0.0.1:8790. This snippet is what
# publishes exactly three of that gateway's paths through mira.vualet.com, so
# the customer's browser talks to Cloudflare and to us, and never to the engine
# host directly.
#
# WHY mira.vualet.com AND NOT api.mira.vualet.com
# api.mira.vualet.com is a TWO-LEVEL subdomain. Cloudflare's universal
# certificate covers *.vualet.com, which does NOT cover a label below that, so
# the TLS handshake fails at the edge before a single byte of ours is involved.
# Verified 2026-08-15 (WA_V2_RUNBOOK). The public surface is mira.vualet.com.
#
# HOW THE CUSTOMER GETS HERE
#   1. Signup hands them MIRA_WHATSAPP_PAIR_BASE + "?token=<connect token>",
#      i.e. https://mira.vualet.com/api/pair/start?token=…
#   2. That Next.js route (src/app/api/pair/start/route.ts) verifies the token,
#      calls the gateway server-to-server over the tunnel with the bearer
#      secret, and 302s them to /pair/<sessionId>#<pairKey>.
#   3. THIS snippet serves that page.
# Note the two halves do not overlap: /api/pair/… is Next's and /pair/… is the
# gateway's. `location ^~ /pair/` cannot swallow /api/pair/start, and the
# separation is deliberate so neither side can shadow the other.
#
# ── THE FRAGMENT ─────────────────────────────────────────────────────────────
# The pair key travels in the URL FRAGMENT: /pair/<sessionId>#<pairKey>. A
# fragment is stripped by the browser before the request is sent, so it reaches
# this proxy, the gateway, $request_uri, the access log and any upstream Referer
# EXACTLY NEVER. That is not a convention to be careful about — it is a property
# of HTTP, and it is why the design puts the key there.
#
# The one way to break it is to make nginx capture and re-emit the URL somewhere
# a fragment could survive. So: nothing below rewrites the path, nothing logs a
# constructed URL, and there is no redirect here that could carry a fragment
# into a Location header. Leave it that way.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limit zone (jury C6). Declare ONCE, at http{} level — a limit_req_zone
# inside server{} is a config error. If the vhost already declares a zone for
# this, do not declare a second one; reuse it and delete this line.
#
#   limit_req_zone $binary_remote_addr zone=wa_pair:10m rate=30r/m;
#
# $binary_remote_addr is the REAL client address here and not a Cloudflare edge
# IP, because this host is configured with set_real_ip_from for every Cloudflare
# range plus `real_ip_header CF-Connecting-IP`. That is verified: origin logs
# record genuine client addresses. If that real_ip config is ever removed, this
# zone silently collapses into ~12 buckets (gotchas#252) — the limiter would
# still look healthy and would be limiting the whole internet together.

# ── The pairing page, its QR poll, and its linking-code submit ───────────────
# ^~ so this prefix wins over any regex location in the vhost, and so no
# static-file or Next.js catch-all can shadow it.
location ^~ /pair/ {
    limit_req                 zone=wa_pair burst=10 nodelay;

    proxy_pass                http://127.0.0.1:8790;
    proxy_http_version        1.1;

    # The gateway's own limiter buckets on this header. Hand it ONE value —
    # the real client address — and never a chain. `proxy_add_x_forwarded_for`
    # is deliberately NOT used: it APPENDS to whatever the caller sent, so the
    # leftmost hop becomes a value the person being limited types (gotchas#247).
    proxy_set_header          X-Forwarded-For   $remote_addr;
    proxy_set_header          X-Real-IP         $remote_addr;
    proxy_set_header          X-Forwarded-Proto $scheme;
    proxy_set_header          Host              $host;

    # A QR page waits on a socket coming up on the far side of an SSH tunnel.
    proxy_connect_timeout     5s;
    proxy_send_timeout        30s;
    proxy_read_timeout        30s;

    # The QR poll must never be served from a cache, by us or by anything in
    # front of us: a stale QR is a customer scanning a code that is already dead.
    proxy_buffering           off;
    add_header                Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header                X-Robots-Tag  "noindex, nofollow" always;

    # The pairing page is ours and frames nothing. Denying framing outright
    # removes clickjacking from a page whose entire job is "scan this and grant
    # access to your WhatsApp account".
    add_header                X-Frame-Options "DENY" always;
    add_header                Referrer-Policy "no-referrer" always;
}

# ── Revocation ──────────────────────────────────────────────────────────────
# Kept public because the customer must be able to pull the plug themselves,
# and a revoke that needs a support ticket is not a revoke.
location ^~ /revoke/ {
    limit_req                 zone=wa_pair burst=5 nodelay;

    proxy_pass                http://127.0.0.1:8790;
    proxy_http_version        1.1;
    proxy_set_header          X-Forwarded-For   $remote_addr;
    proxy_set_header          X-Real-IP         $remote_addr;
    proxy_set_header          X-Forwarded-Proto $scheme;
    proxy_set_header          Host              $host;
    proxy_connect_timeout     5s;
    proxy_read_timeout        15s;
    add_header                Cache-Control "no-store" always;
    add_header                X-Robots-Tag  "noindex, nofollow" always;
}

# ── WHAT IS DELIBERATELY ABSENT ─────────────────────────────────────────────
# /pair/request  — the PROVISIONING endpoint. It is bearer-authenticated with
#   WA_PROVISION_SECRET and fails closed, but it must not be reachable from the
#   internet at all: the only caller is /api/pair/start, on this host, over the
#   loopback tunnel. `location ^~ /pair/` above WOULD proxy /pair/request, so if
#   that ever matters, add an exact-match location before it:
#
#       location = /pair/request { return 404; }
#
#   It is left out today only because the gateway already refuses unauthenticated
#   callers; add it if this snippet is ever used in front of a gateway whose
#   WA_ALLOW_UNAUTHENTICATED_PROVISION hatch might be set.
#
# /health — NOT public (jury C7). It reports internal state and there is no
#   customer who needs it.
#
# Everything else the gateway serves. This is an allow-list of three paths, not
# a reverse proxy of a service.

# ── TO APPLY (operator, on the web host 89.167.49.209) ──────────────────────
#   1. Confirm the tunnel is up first — without it every proxy_pass here 502s:
#        systemctl status wa-tunnel
#        curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8790/
#      Expect 200. A connection-refused means wa-tunnel.service is stopped.
#   2. Install this file:
#        cp nginx-pair-proxy.conf /etc/nginx/snippets/wa-locations.conf
#   3. Ensure the limit_req_zone line above is present ONCE at http{} level.
#   4. Include it from the vhost, inside server{} for mira.vualet.com:
#        include snippets/wa-locations.conf;
#   5. nginx -t && systemctl reload nginx
#
# ── TO UNPUBLISH (kill switch, jury C12) ────────────────────────────────────
#   sed -i 's|    include snippets/wa-locations.conf;||' \
#       /etc/nginx/sites-enabled/mira.vualet.com && nginx -t && systemctl reload nginx
#
# Unpublishing the page does NOT stop pairing from being STARTED — that is
# /api/pair/start, which is Next.js. To close the whole path, unset
# WA_PROVISION_SECRET (or MIRA_WHATSAPP_PAIR_BASE) on the web app: /api/begin
# then returns its honest 503 again instead of handing out a link to a page that
# is no longer served.
