<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="miraGrad" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0%" stop-color="#E4A130"/>
      <stop offset="55%" stop-color="#C7B8F0"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="miraCore" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="35">
      <stop offset="0%" stop-color="#FFF3D9"/>
      <stop offset="40%" stop-color="#E4A130"/>
      <stop offset="100%" stop-color="#C7B8F0"/>
    </radialGradient>
    <radialGradient id="miraInner" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="12">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <!-- Outermost aura (broad awareness) -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#miraGrad)" stroke-width="1.5" opacity="0.25"/>
  <!-- Middle aura (active listening) -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#miraGrad)" stroke-width="2" opacity="0.55"/>
  <!-- Core presence (Mira herself) -->
  <circle cx="100" cy="100" r="36" fill="url(#miraCore)"/>
  <!-- Inner spark (intelligence) -->
  <circle cx="100" cy="100" r="11" fill="url(#miraInner)"/>
</svg>
