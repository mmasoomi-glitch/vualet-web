<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="miraGrad" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="180" y2="180">
      <stop offset="0%" stop-color="#F8A5A0"/>
      <stop offset="55%" stop-color="#C7B8F0"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="miraCore" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="36">
      <stop offset="0%" stop-color="#FFEDEB"/>
      <stop offset="40%" stop-color="#F8A5A0"/>
      <stop offset="100%" stop-color="#C7B8F0"/>
    </radialGradient>
    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="220" y1="80" x2="540" y2="160">
      <stop offset="0%" stop-color="#F8A5A0"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(0, 0)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#miraGrad)" stroke-width="1.5" opacity="0.25"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="url(#miraGrad)" stroke-width="2" opacity="0.55"/>
    <circle cx="100" cy="100" r="36" fill="url(#miraCore)"/>
    <circle cx="100" cy="100" r="11" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Fraunces', 'Cormorant Garamond', 'Times New Roman', serif" font-weight="400">
    <text x="220" y="130" font-size="96" letter-spacing="4" fill="#0A0E1F">MIRA</text>
  </g>

  <!-- Tagline -->
  <g font-family="'Inter', sans-serif" font-weight="400">
    <text x="222" y="160" font-size="13" letter-spacing="3" fill="#94A3B8">BY PRIMAION</text>
  </g>
</svg>
