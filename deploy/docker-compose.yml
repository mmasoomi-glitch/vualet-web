services:
  web:
    image: ghcr.io/mmasoomi-glitch/vualet-web:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - vualet-net
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vualet-net
    depends_on:
      - web

networks:
  vualet-net:

volumes:
  caddy_data:
  caddy_config:
